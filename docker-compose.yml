services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hr_ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - hr_db_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hr_user:hr_password@db:5432/hr_ai_assistant
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./app:/code/app

volumes:
  hr_db_data:
